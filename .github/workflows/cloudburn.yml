name: cloudburn
on:
  push:
    paths: ["infra/**", ".cloudburn.yml"]
  pull_request:
    paths: ["infra/**", ".cloudburn.yml"]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes cloudburn@0.18.4 scan infra --config .cloudburn.yml
